<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хуулга Нэгтгэгч</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;
  --border:#252b3b;--border2:#2e3650;
  --ink:#e8eaf0;--ink-soft:#8b92a8;--ink-faint:#4a5068;
  --blue:#4f7fff;--blue-dim:rgba(79,127,255,.12);
  --green:#2dd6a0;--green-dim:rgba(45,214,160,.12);
  --red:#f4636b;--red-dim:rgba(244,99,107,.12);
  --amber:#f5a623;--purple:#9b7bff;
  --r:10px;--r-sm:6px;
  --mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
::selection{background:var(--blue);color:#fff}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.5}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center}
.logo-name{font-weight:700;font-size:15px}
.logo-sub{font-size:11px;color:var(--ink-soft);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:10px}
.badge-secure{display:flex;align-items:center;gap:5px;background:var(--green-dim);border:1px solid rgba(45,214,160,.2);color:var(--green);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:500}

/* LAYOUT */
.main{max-width:1280px;margin:0 auto;padding:28px 24px 80px}

/* UPLOAD */
.section-label{font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.drop-zone{border:1.5px dashed var(--border2);border-radius:var(--r);padding:36px 28px;text-align:center;cursor:pointer;background:var(--surface);transition:border-color .2s,background .2s}
.drop-zone.drag,.drop-zone:hover{border-color:var(--blue);background:var(--blue-dim)}
.drop-icon{width:44px;height:44px;margin:0 auto 12px;background:var(--blue-dim);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--blue)}
.drop-title{font-weight:600;font-size:15px;margin-bottom:5px}
.drop-sub{color:var(--ink-soft);font-size:13px}
input[type=file]{display:none}
.file-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:6px 10px;font-size:12px}
.chip-name{color:var(--ink-soft)}.chip-size{color:var(--ink-faint);font-family:var(--mono);font-size:11px}
.chip-remove{background:none;border:none;cursor:pointer;color:var(--ink-faint);line-height:0;padding:1px;border-radius:3px;transition:color .15s}
.chip-remove:hover{color:var(--red)}

/* LOG */
.detect-log{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-top:14px;font-family:var(--mono);font-size:11.5px;display:none;max-height:150px;overflow-y:auto}
.detect-log.show{display:block}
.log-line{padding:2px 0;color:var(--ink-soft)}
.log-line.ok{color:var(--green)}.log-line.warn{color:var(--amber)}.log-line.err{color:var(--red)}
.log-prefix{color:var(--ink-faint);margin-right:6px;user-select:none}

/* ACTIONS */
.action-bar{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 20px;border-radius:var(--r-sm);font-size:13px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover:not(:disabled){opacity:.88}
.btn-ghost{background:var(--surface2);border:1px solid var(--border2);color:var(--ink-soft)}.btn-ghost:hover:not(:disabled){color:var(--ink);border-color:var(--blue)}
.btn-export{background:var(--green-dim);border:1px solid rgba(45,214,160,.25);color:var(--green)}.btn-export:hover:not(:disabled){background:rgba(45,214,160,.2)}
.progress-txt{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}

/* DETECT BAR */
.detect-result-bar{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:18px;display:none;flex-wrap:wrap;gap:14px;align-items:center;font-size:12px}
.detect-result-bar.show{display:flex}
.dr-item{display:flex;align-items:center;gap:5px}
.dr-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.dr-dot.warn{background:var(--amber)}.dr-dot.miss{background:var(--ink-faint)}
.dr-key{color:var(--ink-faint)}.dr-val{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:11px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden}
.kpi-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px}
.kpi-card.blue::after{background:var(--blue)}.kpi-card.green::after{background:var(--green)}
.kpi-card.red::after{background:var(--red)}.kpi-card.purple::after{background:var(--purple)}
.kpi-card.amber::after{background:var(--amber)}.kpi-card.teal::after{background:#20d8d8}
.k-label{font-size:11px;color:var(--ink-faint);margin-bottom:8px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-value{font-family:var(--mono);font-size:21px;font-weight:500;letter-spacing:-.5px;margin-bottom:4px}
.kpi-card.blue .k-value{color:var(--blue)}.kpi-card.green .k-value{color:var(--green)}
.kpi-card.red .k-value{color:var(--red)}.kpi-card.purple .k-value{color:var(--purple)}
.kpi-card.amber .k-value{color:var(--amber)}.kpi-card.teal .k-value{color:#20d8d8}
.k-sub{font-size:11px;color:var(--ink-faint)}

/* TABS */
.tab-list{display:flex;gap:4px;margin-bottom:14px}
.tab-btn{padding:7px 16px;border-radius:var(--r-sm);background:transparent;border:1px solid var(--border2);color:var(--ink-soft);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.tab-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.tab-btn:hover:not(.active){border-color:var(--blue);color:var(--blue)}
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.month-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px}
.mc-title{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--ink)}
.mc-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--ink-soft)}
.mc-row b{font-family:var(--mono);font-weight:500;color:var(--ink);font-size:11px}
.mc-row b.pos{color:var(--green)}.mc-row b.neg{color:var(--red)}

/* FILTER */
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:5px;min-width:130px;flex:1}
.fg label{font-size:11px;color:var(--ink-faint);font-weight:500}
.fg input,.fg select{background:var(--bg);border:1px solid var(--border2);color:var(--ink);padding:7px 10px;border-radius:var(--r-sm);font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
.fg input:focus,.fg select:focus{border-color:var(--blue)}

/* TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.table-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.table-title{font-size:13px;font-weight:600}
.tbl-meta{font-size:12px;color:var(--ink-soft);font-family:var(--mono)}
.table-scroll{max-height:500px;overflow:auto}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th{background:var(--surface2);color:var(--ink-soft);padding:8px 12px;text-align:left;font-weight:600;position:sticky;top:0;white-space:nowrap;border-bottom:1px solid var(--border);font-size:11px;cursor:pointer}
table.data th:hover{color:var(--blue)}
table.data td{padding:7px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.data tr:hover td{background:var(--surface2)}
table.data td.num{font-family:var(--mono);font-size:12px}
table.data td.pos{font-family:var(--mono);font-size:12px;color:var(--green)}
table.data td.neg{font-family:var(--mono);font-size:12px;color:var(--red)}
table.data td.txt{font-size:12.5px}
.load-more{width:100%;padding:10px;background:none;border:none;border-top:1px solid var(--border);color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
.load-more:hover{background:var(--blue-dim)}

/* MISC */
.hidden{display:none!important}
.section-block{margin-bottom:26px}
.section-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title .dot{width:8px;height:8px;border-radius:2px;background:var(--blue);flex-shrink:0}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
@media(max-width:640px){.topbar{padding:10px 14px}.main{padding:16px 12px 60px}.kpi-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 4h12M2 8h8M2 12h10"/>
      </svg>
    </div>
    <div>
      <div class="logo-name">Хуулга Нэгтгэгч</div>
      <div class="logo-sub">Ухаалаг · Бүх банк · Бүх бүтэц</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="badge-secure">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 1L1.5 3v3c0 2.5 1.9 4.8 4.5 5.5 2.6-.7 4.5-3 4.5-5.5V3L6 1z"/>
      </svg>
      Зөвхөн browser дээр
    </div>
    <button class="btn btn-export hidden" id="exportBtn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
      </svg>
      Excel татах
    </button>
  </div>
</header>

<div class="main">
  <div class="upload-wrap" style="margin-bottom:20px">
    <div class="section-label">Файл оруулах</div>
    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
      </div>
      <div class="drop-title">Файлуудаа энд чирж тавих</div>
      <div class="drop-sub">.xlsx · .xls · олон файл зэрэг · бүх төрлийн хуулга</div>
      <input type="file" id="fileInput" accept=".xlsx,.xls" multiple>
    </div>
    <div class="file-chips" id="fileChips"></div>
    <div class="detect-log" id="detectLog"></div>
    <div class="action-bar">
      <button class="btn btn-primary" id="mergeBtn" disabled>Нэгтгэх</button>
      <button class="btn btn-ghost" id="clearBtn" disabled>Цэвэрлэх</button>
      <span class="progress-txt" id="progressTxt"></span>
    </div>
  </div>

  <div id="resultSection" class="hidden">
    <div class="detect-result-bar" id="detectBar"></div>

    <div class="section-block">
      <div class="section-title"><div class="dot"></div>Нийт дүн</div>
      <div class="kpi-grid" id="kpiGrid"></div>
    </div>

    <div class="section-block" id="tabSection">
      <div class="section-title"><div class="dot"></div>Задаргаа</div>
      <div class="tab-list" id="tabList"></div>
      <div class="month-grid" id="tabGrid"></div>
    </div>

    <div class="filter-bar" id="filterBar">
      <div class="fg"><label>Эхлэх огноо</label><input type="date" id="fDateStart"></div>
      <div class="fg"><label>Дуусах огноо</label><input type="date" id="fDateEnd"></div>
      <div class="fg" id="fAccountWrap" style="display:none"><label>Харьцсан данс</label><select id="fAccount"><option value="">Бүгд</option></select></div>
      <div class="fg" id="fTypeWrap" style="display:none"><label>Гүйлгээний төрөл</label><select id="fType"><option value="">Бүгд</option><option value="in">Орлого</option><option value="out">Зарлага</option></select></div>
      <div class="fg" style="flex:0 0 auto"><label>&nbsp;</label><button class="btn btn-ghost" onclick="resetFilters()" style="padding:7px 14px">Шүүлт арилгах</button></div>
    </div>

    <div class="table-wrap">
      <div class="table-hdr">

      <button class="load-more hidden" id="loadMoreBtn" onclick="loadMore()">Дараагийн 100 мөр харах ▼</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
// DEVTOOLS PROTECTION
// ════════════════════════════════════════════════
(function(){
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('keydown',function(e){
    if(e.keyCode===123){e.preventDefault();return false}
    if(e.ctrlKey&&e.shiftKey&&[73,74,67].includes(e.keyCode)){e.preventDefault();return false}
    if(e.ctrlKey&&[85,83,80].includes(e.keyCode)){e.preventDefault();return false}
  });
  const thr=160;let warned=false;
  setInterval(function(){
    const open=(window.outerWidth-window.innerWidth>thr)||(window.outerHeight-window.innerHeight>thr);
    if(open&&!warned){warned=true;document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f1117;color:#f4636b;font-family:sans-serif;font-size:18px;text-align:center"><div><div style="font-size:40px;margin-bottom:16px">🔒</div><div>Хандах эрхгүй</div><div style="font-size:13px;color:#4a5068;margin-top:8px">Хуудсыг дахин ачааллана уу</div></div></div>'}
    try{console.clear()}catch(e){}
  },1000);
})();

// ════════════════════════════════════════════════
// COLUMN ROLE DETECTION ENGINE
// Exact match (=) → score 10
// Includes match  → score 3
// ════════════════════════════════════════════════
const ROLES = {
  // Огноо
  date:    ['=гүйлгээний огноо','=тайлант огноо','=огноо','=date','=дата','огноо','date'],
  time:    ['=цаг','=time'],
  // Орлого
  income:  ['=орлого','=кредит гүйлгээ','=credit','=орж ирсэн','=хүлээн авсан','=amt','=amount','орлого','кредит гүйлгээ','credit','income','amt','amount'],
  // Зарлага
  expense: ['=зарлага','=дебит гүйлгээ','=debit','=гарсан','=зарцуулсан','зарлага','дебит гүйлгээ','debit','expense'],
  // Үлдэгдэл
  balance: ['=үлдэгдэл','=эцсийн үлдэгдэл','=balance','=эхний үлдэгдэл','үлдэгдэл','balance'],
  // Тоо (qty)
  qty:     ['=qty','=тоо','=quantity','=тоо хэмжээ','=count','qty','quantity','тоо'],
  // Утга/тайлбар
  desc:    ['=утга','=гүйлгээний утга','=description','=тайлбар','=details','утга','description'],
  // Харьцсан данс
  account: ['=харьцсан данс','=харьцсан','=counterpart','харьцсан данс','харьцсан','account'],
  journal: ['=журнал','=journal','журнал'],
  branch:  ['=байршил','=салбар','байршил'],
};

const MONTH_MN=['1-р сар','2-р сар','3-р сар','4-р сар','5-р сар','6-р сар',
                '7-р сар','8-р сар','9-р сар','10-р сар','11-р сар','12-р сар'];

function norm(h){ return String(h||'').trim().toLowerCase().replace(/\s+/g,' '); }

function scoreRole(h, role){
  const n = norm(h);
  const aliases = ROLES[role] || [];
  for(const a of aliases){
    if(a.startsWith('=') && n === a.slice(1)) return 10;
  }
  for(const a of aliases){
    if(!a.startsWith('=') && n.includes(a)) return 3;
  }
  return 0;
}

// Detect which column index maps to which role
// Returns { role: {idx, name, score} }
function detectRoles(colNames){
  const best = {};
  colNames.forEach((h,i)=>{
    if(!h) return;
    for(const role of Object.keys(ROLES)){
      const sc = scoreRole(h, role);
      if(sc > 0 && sc > (best[role]?.score||0)){
        best[role] = {idx:i, name:h, score:sc};
      }
    }
  });
  return best;
}

// Find the header row: score each row by how many cells match known roles
function findHeaderRow(rawRows){
  let bestScore=0, bestIdx=0;
  const maxScan = Math.min(30, rawRows.length);
  for(let i=0;i<maxScan;i++){
    const row = rawRows[i]||[];
    let score=0;
    row.forEach(cell=>{
      const h = String(cell||'').trim();
      if(!h || h.length > 60) return; // skip long text (likely data)
      for(const role of Object.keys(ROLES)){
        const sc = scoreRole(h, role);
        if(sc>0){ score+=sc; break; }
      }
    });
    if(score>bestScore){ bestScore=score; bestIdx=i; }
  }
  return bestScore >= 3 ? bestIdx : 0;
}

// Junk row detection (footer, signature, summary lines)
const JUNK_KW = [
  'теллерийн гарын үсэг','хэвлэсэн огноо',
  'нийт дүн','нийт орлого','нийт зарлага','нийт:',
  'эцсийн үлдэгдэл:','эцсийн үлдэгдэл',
  'grand total','total','гарын үсэг',
  'нийт\t','нийт ','нийт\n'
];
function isJunk(row){
  if(!row) return true;
  const nonEmpty = row.filter(c=>c!==null&&c!==''&&c!==undefined);
  if(nonEmpty.length < 2) return true;
  const txt = nonEmpty.map(c=>String(c).toLowerCase()).join(' ');
  // "нийт" гэж эхэлсэн мөр (footer summary) — текст нь маш богино
  const firstNonEmpty = String(nonEmpty[0]||'').toLowerCase().trim();
  if(firstNonEmpty==='нийт'||firstNonEmpty.startsWith('нийт ')) return true;
  // Зөвхөн тоон утга бүхий 1-2 cell-тэй footer мөр
  if(nonEmpty.length<=2 && nonEmpty.every(c=>typeof c==='number'||/^[\d,\.]+$/.test(String(c)))) return true;
  return JUNK_KW.some(k=>txt.includes(k));
}

// Convert any value to a clean number
function toNum(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='number') return v;
  const s = String(v).replace(/[,\s₮$€£]/g,'').replace(/\(([^)]+)\)/g,'-$1');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

// Is a column "numeric"? (majority of values are numbers)
function isNumericCol(colName, rows, threshold=0.6){
  const sample = rows.slice(0,100).map(r=>r[colName]).filter(v=>v!==''&&v!==null&&v!==undefined);
  if(sample.length===0) return false;
  const numCnt = sample.filter(v=>toNum(v)!==null).length;
  return numCnt/sample.length >= threshold;
}

// Parse one sheet
function parseSheet(rawRows, fileName){
  if(!rawRows||rawRows.length===0) return {rows:[],roles:{},colNames:[]};

  const hIdx = findHeaderRow(rawRows);
  const headerRow = rawRows[hIdx]||[];
  const colNames = headerRow.map(h=>String(h||'').trim()).filter((_,i)=>headerRow[i]!==null&&headerRow[i]!==undefined&&String(headerRow[i]).trim()!=='');

  // Actual column indices in the raw row
  const colIndices = [];
  headerRow.forEach((h,i)=>{ if(String(h||'').trim()!=='') colIndices.push(i); });

  const roles = detectRoles(colNames);

  // Build data rows
  const rows = [];
  for(let r=hIdx+1;r<rawRows.length;r++){
    const raw = rawRows[r];
    if(isJunk(raw)) continue;
    const obj = {};
    colNames.forEach((h,ci)=>{
      const rawIdx = colIndices[ci];
      let v = raw ? raw[rawIdx] : undefined;
      if(v===undefined||v===null) v='';
      // Numeric conversion: ONLY convert if value looks purely numeric
      // Do NOT convert account numbers, names, descriptions, dates
      if(typeof v==='string' && v.trim()!==''){
        const trimmed = v.trim();
        // Pure number pattern: optional minus, digits, optional comma/space separators, optional decimal
        // Must NOT be an account number (all digits, long) or contain letters
        const pureNum = /^-?[\d\s,]+\.?\d*$/.test(trimmed);
        const hasLetters = /[a-zA-Zа-яА-ЯөүёЭӨҮ]/i.test(trimmed);
        const looksLikeAccount = /^\d{8,}$/.test(trimmed.replace(/[\s,]/g,'')); // 8+ digit all-number = account
        if(pureNum && !hasLetters && !looksLikeAccount){
          const n = toNum(v);
          if(n!==null){ v = n; }
        }
      }
      obj[h] = v;
    });
    // Skip all-empty rows
    if(Object.values(obj).every(v=>v===''||v===null||v===undefined)) continue;
    rows.push(obj);
  }

  return {rows, roles, colNames};
}

async function doMerge(){
  let allRows=[], headersUnion=[], roleScores={};
  globalRoles={};

  for(let i=0;i<files.length;i++){
    const {file}=files[i];
    progressTxt.textContent=`Уншиж байна ${i+1}/${files.length} · ${file.name}`;
    log(`📄 ${file.name}`,'');

    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array',cellDates:true,raw:false});

      wb.SheetNames.forEach(sheetName=>{
        const ws=wb.Sheets[sheetName];
        const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true,blankrows:false});
        const {rows,roles,colNames}=parseSheet(raw,file.name);

        log(`  Шит "${sheetName}": header=${findHeaderRow(raw)+1}-р мөр · ${rows.length} мөр`,rows.length>0?'ok':'warn');

        // Merge roles: higher score wins
        Object.entries(roles).forEach(([role,info])=>{
          if(info.score>(roleScores[role]||0)){
            globalRoles[role]=info.name;
            roleScores[role]=info.score;
          }
        });

        // Union headers
        colNames.forEach(h=>{if(!headersUnion.includes(h))headersUnion.push(h);});
        allRows=allRows.concat(rows);
      });
    }catch(e){
      log(`  Уншиж чадсангүй: ${e.message}`,'err');
    }
  }

  if(allRows.length===0){log('Нэгтгэх өгөгдөл олдсонгүй.','err');progressTxt.textContent='';return;}

  // Deduplicate
  const seen=new Set();
  const unique=allRows.filter(row=>{
    const key=JSON.stringify(row);
    if(seen.has(key))return false;
    seen.add(key);return true;
  });
  log(`Нийт ${allRows.length} → давхардал ${allRows.length-unique.length} хасав → ${unique.length} мөр үлдлээ`,'ok');

  // Sort by date if available
  const dCol=globalRoles.date;
  if(dCol){
    unique.sort((a,b)=>{
      const da=String(a[dCol]||''),db=String(b[dCol]||'');
      return da<db?-1:da>db?1:0;
    });
  }

  headers=headersUnion;
  mergedData=unique;

  // Detect numeric columns
  numericCols=headers.filter(h=>isNumericCol(h,mergedData));

  // Finance detection — smart mode decision
  const incCol=globalRoles.income;
  const expCol=globalRoles.expense;

  // Generic aliases that alone should NOT trigger finance mode
  const GENERIC_ALIASES=['amt','amount','quantity','qty','тоо','count'];
  const incName=norm(incCol||'');
  const expName=norm(expCol||'');

  const incIsGeneric=GENERIC_ALIASES.includes(incName);
  const expIsGeneric=GENERIC_ALIASES.includes(expName);

  // Finance mode requires at least one SPECIFIC finance column
  // (i.e. орлого, зарлага, кредит гүйлгээ, дебит гүйлгээ, credit, debit)
  const FINANCE_SPECIFIC=['орлого','зарлага','кредит гүйлгээ','дебит гүйлгээ','credit','debit','кредит','дебит'];
  const incSpecific= incCol && FINANCE_SPECIFIC.some(k=>incName.includes(k));
  const expSpecific= expCol && FINANCE_SPECIFIC.some(k=>expName.includes(k));

  hasFinanceData=!!(incSpecific||expSpecific);

  // Generic numeric cols (not income/expense/balance/qty roles)
  const roleColNames=new Set(Object.values(globalRoles).filter(Boolean));
  // Also exclude columns that look like account numbers (long digit strings in data)
  function looksLikeAccountCol(col){
    const sample=mergedData.slice(0,30).map(r=>String(r[col]||'').trim()).filter(v=>v);
    const acctLike=sample.filter(v=>/^\d{8,}$/.test(v.replace(/[\s,]/g,''))).length;
    return acctLike/Math.max(sample.length,1) > 0.5;
  }
  numericCols=numericCols.filter(h=>!looksLikeAccountCol(h));
  genericNumCols=numericCols.filter(h=>!roleColNames.has(h)||(h!==incCol&&h!==expCol&&h!==globalRoles.balance));

  log(`Илрүүлсэн баганууд: ${Object.entries(globalRoles).filter(([,v])=>v).map(([k,v])=>`${k}="${v}"`).join(' · ')}`,'ok');

  // Sanity check: income === expense → warn
  if(incCol&&expCol&&incCol===expCol){
    log(`⚠️ Орлого ба зарлага ижил багана "${incCol}" — зөрчил байна!`,'err');
    globalRoles.expense=null;
  }

  // Populate filters
  populateFilters();
  applyFilters();
  resultSec.classList.remove('hidden');
  exportBtn.classList.remove('hidden');
  progressTxt.textContent='';
}

function populateFilters(){

}

['fDateStart','fDateEnd','fAccount','fType'].forEach(id=>{

});

function applyFilters(){
  const ds=document.getElementById('fDateStart').value;
  const de=document.getElementById('fDateEnd').value;
  const acc=document.getElementById('fAccount').value;
  const tp=document.getElementById('fType').value;
  const dCol=globalRoles.date;
  const iCol=globalRoles.income;
  const eCol=globalRoles.expense;
  const aCol=globalRoles.account;

  filteredData=mergedData.filter(row=>{
    if(dCol&&(ds||de)){
      const rd=String(row[dCol]||'').slice(0,10).replace(/\./g,'-');
      if(ds&&rd<ds)return false;
      if(de&&rd>de)return false;
    }
    if(acc&&aCol&&String(row[aCol])!==acc)return false;
    if(tp&&(iCol||eCol)){
      const inc=toNum(row[iCol])||0;
      const exp=Math.abs(toNum(row[eCol])||0);
      if(tp==='in'&&inc<=0)return false;
      if(tp==='out'&&exp<=0)return false;
    }
    return true;
  });

  rowOffset=0;
  renderKPI();
  renderTabs();
  renderTable(true);
}

  ['fDateStart','fDateEnd'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  ['fAccount','fType'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  applyFilters();
};

// HELPERS
// ════════════════════════════════════════════════
function getNum(row,col){ return col?Math.max(0,toNum(row[col])||0):0; }
function getSignedNum(row,col){ return col?toNum(row[col])||0:0; }

function fmtN(v,decimals=2){
  return Number(v).toLocaleString('mn-MN',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}
function fmtC(v){ return Number(v).toLocaleString(); }
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ════════════════════════════════════════════════
// KPI — Smart: finance mode or generic numeric mode
// ════════════════════════════════════════════════
function renderKPI(){
  const data=filteredData;
  const iCol=globalRoles.income;
  const eCol=globalRoles.expense;
  const bCol=globalRoles.balance;
  const qCol=globalRoles.qty;
  const cards=[];

  if(hasFinanceData){
    // Finance mode
    let totalInc=0,totalExp=0,incCnt=0,expCnt=0;
    data.forEach(r=>{
      const incRaw=r[iCol];
      const expRaw=r[eCol];
      const incEmpty=(incRaw===''||incRaw===null||incRaw===undefined);
      const expEmpty=(expRaw===''||expRaw===null||expRaw===undefined);
      const inc=incEmpty?0:(toNum(incRaw)||0);
      const exp=expEmpty?0:Math.abs(toNum(expRaw)||0);
      if(!incEmpty&&inc>0&&expEmpty){totalInc+=inc;incCnt++;}
      else if(!expEmpty&&exp>0&&incEmpty){totalExp+=exp;expCnt++;}
      else if(inc>0&&exp===0){totalInc+=inc;incCnt++;}
      else if(exp>0&&inc===0){totalExp+=exp;expCnt++;}
      else if(inc>0&&exp>0){totalInc+=inc;incCnt++;totalExp+=exp;expCnt++;}
    });
    const net=totalInc-totalExp;
    cards.push({label:'Нийт орлого',val:fmtN(totalInc),cls:'green',sub:`${fmtC(incCnt)} гүйлгээ`});
    cards.push({label:'Нийт зарлага',val:fmtN(totalExp),cls:'red',sub:`${fmtC(expCnt)} гүйлгээ`});
    cards.push({label:'Цэвэр дүн',val:fmtN(net),cls:net>=0?'blue':'red',sub:'Орлого − зарлага'});
    if(bCol){
      const lastBal=toNum(data[data.length-1]?.[bCol]);
      if(lastBal!==null) cards.push({label:'Эцсийн үлдэгдэл',val:fmtN(lastBal),cls:'purple',sub:'Хамгийн сүүлийн мөр'});
    }
  } else {
    // Generic numeric mode: sum each numeric col
    const COLORS=['blue','green','red','purple','amber','teal'];
    numericCols.slice(0,6).forEach((col,i)=>{
      const sum=data.reduce((s,r)=>{const v=toNum(r[col]);return s+(v||0);},0);
      const nonZero=data.filter(r=>(toNum(r[col])||0)!==0).length;
      cards.push({label:`${col} (нийт)`,val:fmtN(sum),cls:COLORS[i%COLORS.length],sub:`${fmtC(nonZero)} мөрт утга байна`});
    });
  }

  cards.push({label:'Нийт мөр',val:fmtC(data.length),cls:'amber',sub:`${files.length} файлаас нэгтгэв`});

  kpiGrid.innerHTML=cards.map(c=>`
    <div class="kpi-card ${c.cls}">
      <div class="k-label">${c.label}</div>
      <div class="k-value">${c.val}</div>
      <div class="k-sub">${c.sub}</div>
    </div>`).join('');

  // Detect bar
  const drItems=[
    {key:'Огноо',val:globalRoles.date||'—',ok:!!globalRoles.date},
    {key:'Орлого',val:globalRoles.income||'—',ok:!!globalRoles.income},
    {key:'Зарлага',val:globalRoles.expense||'—',ok:!!globalRoles.expense},
    {key:'Үлдэгдэл',val:globalRoles.balance||'—',ok:!!globalRoles.balance},
    {key:'Данс',val:globalRoles.account||'—',ok:!!globalRoles.account},
    {key:'Тоо/Qty',val:globalRoles.qty||'—',ok:!!globalRoles.qty},
    {key:'Нийт мөр',val:mergedData.length.toLocaleString(),ok:true},
  ];
  detectBar.innerHTML=drItems.map(d=>`
    <div class="dr-item">
      <div class="dr-dot${d.ok?'':' miss'}"></div>
      <span class="dr-key">${d.key}:</span>
      <span class="dr-val">${d.val}</span>
    </div>`).join('');
  detectBar.classList.add('show');
}

// ════════════════════════════════════════════════
// TABS — Month / Account / Numeric columns
// ════════════════════════════════════════════════
let activeTab='month';

function renderTabs(){
  const dCol=globalRoles.date;
  const aCol=globalRoles.account;
  const tabs=[];
  if(dCol) tabs.push({id:'month',label:'Сараар'});
  if(aCol) tabs.push({id:'account',label:'Дансаар'});
  // For generic numeric cols, show column tabs
  if(!hasFinanceData&&numericCols.length>0){
    numericCols.slice(0,4).forEach(c=>tabs.push({id:'col_'+c,label:c}));
  }

  if(tabs.length===0){document.getElementById('tabSection').classList.add('hidden');return;}
  document.getElementById('tabSection').classList.remove('hidden');

  tabList.innerHTML=tabs.map(t=>`
    <button class="tab-btn${activeTab===t.id?' active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  tabList.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      activeTab=btn.dataset.tab;
      tabList.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderTabContent();
    });
  });
  // Set valid active tab
  if(!tabs.find(t=>t.id===activeTab)) activeTab=tabs[0]?.id||'month';
  renderTabContent();
}

function accumRow(g,r){
  const iCol=globalRoles.income;
  const eCol=globalRoles.expense;
  const incRaw=r[iCol];
  const expRaw=r[eCol];
  // Distinguish truly empty from zero
  const incEmpty=(incRaw===''||incRaw===null||incRaw===undefined);
  const expEmpty=(expRaw===''||expRaw===null||expRaw===undefined);
  const inc=incEmpty?0:(toNum(incRaw)||0);
  const exp=expEmpty?0:Math.abs(toNum(expRaw)||0);
  if(!incEmpty&&inc>0&&expEmpty){g.inc+=inc;}
  else if(!expEmpty&&exp>0&&incEmpty){g.exp+=exp;}
  else if(inc>0&&exp===0){g.inc+=inc;}
  else if(exp>0&&inc===0){g.exp+=exp;}
  else if(inc>0&&exp>0){g.inc+=inc;g.exp+=exp;}
  g.cnt++;
}

function renderTabContent(){
  const data=filteredData;
  const dCol=globalRoles.date;
  const aCol=globalRoles.account;

  if(activeTab==='month'&&dCol){
    const map=new Map();
    data.forEach(r=>{
      const d=String(r[dCol]||'');
      const key=d.slice(0,7).replace(/[-/\.T]/g,c=>c==='T'?'':'.').slice(0,7);
      if(!key||key.length<4)return;
      if(!map.has(key))map.set(key,{inc:0,exp:0,cnt:0});
      accumRow(map.get(key),r);
    });
    const sorted=[...map.entries()].sort((a,b)=>a[0]<b[0]?-1:1);
    tabGrid.innerHTML=sorted.map(([k,g])=>{
      const parts=k.split('.');
      const label=parts.length>=2?`${parts[0]} · ${MONTH_MN[parseInt(parts[1],10)-1]||parts[1]}`:k;
      const net=g.inc-g.exp;
      return `<div class="month-card">
        <div class="mc-title">${label}</div>
        <div class="mc-row"><span>Гүйлгээ</span><b>${fmtC(g.cnt)}</b></div>
        ${hasFinanceData?`
        <div class="mc-row"><span>Орлого</span><b class="pos">${fmtN(g.inc)}</b></div>
        <div class="mc-row"><span>Зарлага</span><b class="neg">${fmtN(g.exp)}</b></div>
        <div class="mc-row"><span>Цэвэр</span><b class="${net>=0?'pos':'neg'}">${fmtN(net)}</b></div>`:''}
      </div>`;
    }).join('')||'<div style="color:var(--ink-faint);padding:12px;font-size:13px">Огноогоор бүлэглэж чадсангүй.</div>';

  } else if(activeTab==='account'&&aCol){
    const map=new Map();
    data.forEach(r=>{
      const key=String(r[aCol]||'Тодорхойгүй').trim();
      if(!map.has(key))map.set(key,{inc:0,exp:0,cnt:0});
      accumRow(map.get(key),r);
    });
    const sorted=[...map.entries()].sort((a,b)=>(b[1].inc+b[1].exp)-(a[1].inc+a[1].exp));
    tabGrid.innerHTML=sorted.slice(0,24).map(([k,g])=>`
      <div class="month-card">
        <div class="mc-title" title="${esc(k)}">${esc(k.length>26?k.slice(0,26)+'…':k)}</div>
        <div class="mc-row"><span>Гүйлгээ</span><b>${fmtC(g.cnt)}</b></div>
        <div class="mc-row"><span>Орлого</span><b class="pos">${fmtN(g.inc)}</b></div>
        <div class="mc-row"><span>Зарлага</span><b class="neg">${fmtN(g.exp)}</b></div>
      </div>`).join('');

  } else if(activeTab.startsWith('col_')){
    const col=activeTab.slice(4);
    const map=new Map();
    data.forEach(r=>{
      // Group by date if available, else by row index chunk
      const d=dCol?String(r[dCol]||'').slice(0,7).replace(/[-/\.T]/g,c=>c==='T'?'':'.').slice(0,7):'Бүгд';
      if(!map.has(d))map.set(d,{sum:0,cnt:0,min:Infinity,max:-Infinity});
      const g=map.get(d);
      const v=toNum(r[col]);
      if(v!==null){g.sum+=v;g.cnt++;if(v<g.min)g.min=v;if(v>g.max)g.max=v;}
    });
    const sorted=[...map.entries()].sort((a,b)=>a[0]<b[0]?-1:1);
    tabGrid.innerHTML=sorted.map(([k,g])=>`
      <div class="month-card">
        <div class="mc-title">${k}</div>
        <div class="mc-row"><span>Мөр</span><b>${fmtC(g.cnt)}</b></div>
        <div class="mc-row"><span>Нийлбэр</span><b class="pos">${fmtN(g.sum)}</b></div>
        <div class="mc-row"><span>Хамгийн бага</span><b>${g.min===Infinity?'—':fmtN(g.min)}</b></div>
        <div class="mc-row"><span>Хамгийн их</span><b>${g.max===-Infinity?'—':fmtN(g.max)}</b></div>
      </div>`).join('');
  }
}

// ════════════════════════════════════════════════
// TABLE
// ════════════════════════════════════════════════
let sortCol=null,sortAsc=true;

function renderTable(reset){
  const iCol=globalRoles.income;
  const eCol=globalRoles.expense;

  if(reset){
    tblHead.innerHTML=`<tr>${headers.map(h=>`<th onclick="sortBy('${esc(h)}')" title="Эрэмбэлэх">${esc(h)} <span style="color:var(--ink-faint);font-size:9px">↕</span></th>`).join('')}</tr>`;
    tblBody.innerHTML='';
    rowOffset=0;
  }

  const batch=filteredData.slice(rowOffset,rowOffset+BATCH);
  const frag=document.createDocumentFragment();

  batch.forEach(row=>{
    const tr=document.createElement('tr');
    headers.forEach(h=>{
      const td=document.createElement('td');
      const v=row[h];
      // Show as text if: string type, or account col, or desc col
      const forceText= h===globalRoles.account || h===globalRoles.desc ||
                       h===globalRoles.journal || h===globalRoles.branch ||
                       h===globalRoles.accname || h===globalRoles.bank;
      const isNum= !forceText && (typeof v==='number' || numericCols.includes(h));
      if(isNum && v!=='' && v!==null){
        const n=toNum(v)||0;
        td.textContent=fmtN(n);
        if(h===iCol&&n>0)td.className='pos';
        else if(h===eCol&&n!==0)td.className='neg';
        else td.className='num';
      } else {
        td.textContent=v!==null&&v!==undefined?String(v):'';
        td.className='txt';
      }
      tr.appendChild(td);
    });
    frag.appendChild(tr);
  });
  tblBody.appendChild(frag);
  rowOffset+=batch.length;
  tblMeta.textContent=`${fmtC(rowOffset)} / ${fmtC(filteredData.length)} мөр`;
  loadMoreBtn.classList.toggle('hidden',rowOffset>=filteredData.length);
}

window.loadMore=function(){renderTable(false);};

window.sortBy=function(col){
  if(sortCol===col){sortAsc=!sortAsc;}else{sortCol=col;sortAsc=true;}
  filteredData.sort((a,b)=>{
    const av=a[col],bv=b[col];
    const an=toNum(av),bn=toNum(bv);
    let cmp=0;
    if(an!==null&&bn!==null)cmp=an-bn;
    else cmp=String(av||'').localeCompare(String(bv||''));
    return sortAsc?cmp:-cmp;
  });
  rowOffset=0;
  tblBody.innerHTML='';
  renderTable(false);
};

// ════════════════════════════════════════════════
// EXPORT
// ════════════════════════════════════════════════
exportBtn.addEventListener('click',()=>{
  const data=filteredData.length?filteredData:mergedData;
  const ws=XLSX.utils.json_to_sheet(data,{header:headers});
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Нэгтгэсэн');
  XLSX.writeFile(wb,`merged_${new Date().toISOString().slice(0,10)}.xlsx`);
});
</script>
